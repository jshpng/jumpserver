# One-command monitoring stack for JumpServer (Prometheus + Grafana).
#
# Usage:
#   1. Edit prometheus/prometheus.yml, point the target to your core service
#      (and configure the bearer token if HEALTH_CHECK_TOKEN is set).
#   2. docker compose up -d
#   3. Open http://localhost:3000 (admin / jumpserver), the dashboards are
#      auto-provisioned in the "JumpServer" folder.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: jms_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: jms_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: jumpserver
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
